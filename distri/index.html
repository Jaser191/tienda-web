<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda Exclusiva - Inicio (Módulo 4)</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">
    <!-- Open Iconic CSS -->
    <link rel="stylesheet" href="node_modules/open-iconic/font/css/open-iconic-bootstrap.min.css">
    <!-- CSS compilado desde Sass -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- Barra de navegación fija y responsive -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top shadow">
        <div class="container">
            <a class="navbar-brand" href="index.html"><span class="oi oi-home"></span> TiendaWeb</a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ml-auto">
                    <li class="nav-item active">
                        <a class="nav-link" href="index.html">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="contacto.html">Contacto y Detalles</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Carrusel superior -->
    <div id="carouselExampleIndicators" class="carousel slide mb-4" data-ride="carousel">
        <ol class="carousel-indicators">
            <li data-target="#carouselExampleIndicators" data-slide-to="0" class="active"></li>
            <li data-target="#carouselExampleIndicators" data-slide-to="1"></li>
        </ol>
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=1200&q=80" class="d-block w-100" alt="Promo 1" style="height: 400px; object-fit: cover;">
            </div>
            <div class="carousel-item">
                <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=1200&q=80" class="d-block w-100" alt="Promo 2" style="height: 400px; object-fit: cover;">
            </div>
        </div>
        <a class="carousel-control-prev" href="#carouselExampleIndicators" role="button" data-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        </a>
        <a class="carousel-control-next" href="#carouselExampleIndicators" role="button" data-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
        </a>
    </div>

    <div class="container my-4">

        <!-- Breadcrumbs -->
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item active" aria-current="page">Inicio</li>
            </ol>
        </nav>

        <!-- Botón que activa el modal -->
        <div class="text-right mb-4">
            <button type="button" class="btn btn-success" id="btnModalApertura" data-toggle="modal" data-target="#registroModal">
                <span class="oi oi-person"></span> ¡Regístrate aquí!
            </button>
        </div>

        <h2 class="text-center mb-4">Nuestros Productos</h2>
        
        <div class="row">
            <div class="col-md-4 mb-4">
                <div class="card h-100 shadow-sm">
                    <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=500&q=80" class="card-img-top" alt="Smartwatch" style="height: 200px; object-fit: cover;">
                    <div class="card-body">
                        <h5 class="card-title font-weight-bold">Reloj Inteligente Sport</h5>
                        <p class="card-text text-muted">Controla tu actividad física en tiempo real.</p>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- Componente Modal sobre el final del body -->
    <div class="modal fade" id="registroModal" tabindex="-1" role="dialog" aria-labelledby="registroModalLabel" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header bg-dark text-white">
                    <h5 class="modal-title" id="registroModalLabel">Registro de Usuario</h5>
                    <button type="button" class="close text-white" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <form>
                        <div class="form-group">
                            <label for="modalNombre">Nombre completo</label>
                            <input type="text" class="form-control" id="modalNombre" placeholder="Tu nombre" required>
                        </div>
                        <div class="form-group">
                            <label for="modalEmail">Correo electrónico</label>
                            <input type="email" class="form-control" id="modalEmail" placeholder="correo@ejemplo.com" required>
                        </div>
                        <button type="submit" class="btn btn-success btn-block">Enviar Registro</button>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary btn-sm" data-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-dark text-white py-4 mt-5">
        <div class="container text-center">
            <p class="mb-0">&copy; 2026 TiendaWeb. Todos los derechos reservados.</p>
        </div>
    </footer>

    <!-- Scripts JS de Bootstrap -->
    <script src="node_modules/jquery/dist/jquery.slim.min.js"></script>
    <script src="node_modules/popper.js/dist/umd/popper.min.js"></script>
    <script src="node_modules/bootstrap/dist/js/bootstrap.min.js"></script>

    <!-- Script requerido para los eventos del modal y control de estados del botón -->
    <script>
        $(function () {
            // Velocidad del carrusel
            $('.carousel').carousel({
                interval: 2000
            });

            // Eventos del modal y control del botón
            $('#registroModal').on('show.bs.modal', function (e) {
                console.log('El modal está comenzando a abrirse (show)');
                $('#btnModalApertura').prop('disabled', true).removeClass('btn-success').addClass('btn-danger');
            });

            $('#registroModal').on('shown.bs.modal', function (e) {
                console.log('El modal terminó de abrirse completamente (shown)');
            });

            $('#registroModal').on('hide.bs.modal', function (e) {
                console.log('El modal está comenzando a ocultarse (hide)');
            });

            $('#registroModal').on('hidden.bs.modal', function (e) {
                console.log('El modal terminó de ocultarse completamente (hidden)');
                $('#btnModalApertura').prop('disabled', false).removeClass('btn-danger').addClass('btn-success');
            });
        });
    </script>
</body>
</html>
